# Stack do home server (Portainer + Traefik). Compose completo, não override.
# Não depende de arquivos do checkout do Git montados no host: configuração do
# Nginx fica no command, scripts do grafo ficam no command e dados persistem em
# volumes Docker nomeados.
services:
  # Volumes Docker novos pertencem ao root. A imagem Hermes executa o gateway
  # como UID 10000, então ajustamos o dono do vault antes de iniciar os leitores
  # e o escritor. Permite que Hermes grave notas sem tornar o volume público.
  vault-permissions:
    image: alpine:3.22
    user: "0:0"
    restart: "no"
    command: ["chown", "-R", "10000:10000", "/vault"]
    volumes:
      - obsidian_vault:/vault

  perlite:
    image: sec77/perlite:latest
    restart: unless-stopped
    environment:
      NOTES_PATH: Pessoal
      SITE_TITLE: Pessoal
      SITE_NAME: Notas
      LINE_BREAKS: "true"
      NICE_LINKS: "true"
      SHOW_TOC: "true"
      SHOW_LOCAL_GRAPH: "true"
      HTML_SAFE_MODE: "true"
      HIDDEN_FILE_ACCESS: "false"
      HIDE_FOLDERS: docs,private,trash
    volumes:
      - obsidian_vault:/var/www/perlite/Pessoal:ro
    depends_on:
      vault-permissions:
        condition: service_completed_successfully
    networks:
      - default

  # Mantém o grafo global do Perlite atualizado sem bind mount de scripts.
  perlite-graph:
    image: python:3.12-alpine
    restart: unless-stopped
    command:
      - python
      - -u
      - -c
      - |
        import json, re, time
        from pathlib import Path

        vault = Path('/vault')
        wiki = re.compile(r'\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|[^\]]*)?\]\]')
        tag_re = re.compile(r'(?<!\w)#([a-zA-Z0-9_/-]+)')
        fence = re.compile(r'```.*?```', re.S)
        last = None
        while True:
            files = sorted(p for p in vault.rglob('*.md') if not any(part.startswith('.') for part in p.relative_to(vault).parts))
            fingerprint = '\n'.join(f'{p.relative_to(vault)}:{p.stat().st_mtime_ns}:{p.stat().st_size}' for p in files)
            if fingerprint != last or not (vault / 'metadata.json').exists():
                try:
                    by_name = {p.stem: p for p in files}
                    rows = []
                    backlinks_by_path = {}
                    for path in files:
                        rel = path.relative_to(vault).as_posix()
                        body = fence.sub('', path.read_text(encoding='utf-8'))
                        item = {'fileName': path.stem, 'relativePath': rel}
                        links = []
                        for match in wiki.finditer(body):
                            target_name = match.group(1).strip()
                            link = {'link': target_name}
                            target_path = by_name.get(Path(target_name).stem)
                            if target_path is not None:
                                target_rel = target_path.relative_to(vault).as_posix()
                                link['relativePath'] = target_rel
                            if link not in links:
                                links.append(link)
                                if 'relativePath' in link:
                                    backlinks_by_path.setdefault(link['relativePath'], []).append({
                                        'fileName': path.stem,
                                        'link': Path(link['relativePath']).stem,
                                        'relativePath': rel,
                                    })
                        if links:
                            item['links'] = links
                        tags = sorted({tag.lower() for tag in tag_re.findall(body)})
                        if tags:
                            item['tags'] = tags
                        rows.append(item)
                    for item in rows:
                        backlinks = backlinks_by_path.get(item['relativePath'])
                        if backlinks:
                            item['backlinks'] = backlinks
                    payload = json.dumps(rows, ensure_ascii=False, indent=2) + '\n'
                    target = vault / 'metadata.json'
                    tmp = vault / 'metadata.json.tmp'
                    tmp.write_text(payload, encoding='utf-8')
                    tmp.replace(target)
                    print(f'grafo atualizado ({len(files)} notas)', flush=True)
                    last = fingerprint
                except Exception as exc:
                    print(f'falhou ao atualizar o grafo: {exc}', flush=True)
            time.sleep(10)
    volumes:
      - obsidian_vault:/vault
    depends_on:
      vault-permissions:
        condition: service_completed_successfully
    networks:
      - default

  perlite-web:
    image: nginx:stable
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        server {
            listen 80;
            server_name localhost;
            root /var/www/perlite;
            index index.php index.html index.htm;
            location / { try_files $$uri $$uri/ /index.php; }
            location ~ \.php$$ {
                try_files $$uri =404;
                fastcgi_split_path_info ^(.+\.php)(/.+)$;
                fastcgi_pass perlite:9000;
                fastcgi_index index.php;
                include fastcgi_params;
                fastcgi_param REQUEST_URI $$request_uri;
                fastcgi_param SCRIPT_FILENAME $$document_root$$fastcgi_script_name;
                fastcgi_param PATH_INFO $$fastcgi_path_info;
            }
            location ~ /\.ht { deny all; }
            location ~* ^/(.*)/\.obsidian/appearance\.json$$ { allow all; }
            location ~* ^/(.*)/\.obsidian/(.*)/(.*)\.css$$ { allow all; }
            location ~* ^/(.*)/\.obsidian/(.*)/(.*)\.map$$ { allow all; }
            location ~ \.(git|github|obsidian|trash) { deny all; }
            location ~ \.(md|json)$$ { deny all; }
        }
        NGINX
        exec nginx -g 'daemon off;'
    volumes_from:
      - perlite
    depends_on:
      - perlite
      - perlite-graph
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.perlite-vps.rule=Host(`${NOTES_HOST:?Defina_NOTES_HOST_no_Portainer}`)"
      - "traefik.http.routers.perlite-vps.entrypoints=websecure"
      - "traefik.http.routers.perlite-vps.tls.certresolver=leresolver"
      - "traefik.http.routers.perlite-vps.middlewares=perlite-auth"
      - "traefik.http.middlewares.perlite-auth.basicauth.users=${TRAEFIK_BASIC_AUTH_USERS:?Defina_TRAEFIK_BASIC_AUTH_USERS_no_Portainer}"
      - "traefik.http.services.perlite-vps.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"

  hermes:
    image: nousresearch/hermes-agent:v2026.9.24
    restart: unless-stopped
    command: ["gateway", "run"]
    shm_size: "1gb"
    volumes:
      - hermes_data:/opt/data
      - obsidian_vault:/obsidian
    environment:
      TZ: America/Sao_Paulo
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?Defina_HERMES_DASHBOARD_BASIC_AUTH_USERNAME_no_Portainer}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?Defina_HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_no_Portainer}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?Defina_HERMES_DASHBOARD_BASIC_AUTH_SECRET_no_Portainer}
      OBSIDIAN_VAULT_PATH: /obsidian
      HERMES_WRITE_SAFE_ROOT: /opt/data:/obsidian
      API_SERVER_ENABLED: "false"
      API_SERVER_HOST: 127.0.0.1
    depends_on:
      vault-permissions:
        condition: service_completed_successfully
    mem_limit: 4g
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hermes-vps.rule=Host(`${HERMES_HOST:?Defina_HERMES_HOST_no_Portainer}`)"
      - "traefik.http.routers.hermes-vps.entrypoints=websecure"
      - "traefik.http.routers.hermes-vps.tls.certresolver=leresolver"
      - "traefik.http.routers.hermes-vps.service=hermes-vps"
      - "traefik.http.services.hermes-vps.loadbalancer.server.port=9119"
      - "traefik.docker.network=traefik"

volumes:
  hermes_data:
  obsidian_vault:

networks:
  traefik:
    external: true
