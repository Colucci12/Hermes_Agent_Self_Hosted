# Stack do home server (Portainer + Traefik). Arquivo COMPLETO, não override:
#   docker compose -f docker-compose.homeserver.yml up -d
#
# Nada publica porta no host; o Traefik alcança os serviços pela rede "traefik".
# Hosts e o hash do basicAuth vêm do .env (veja .env.example).
#
#   CHAT_HOST    Open WebUI      conta própria do Open WebUI (sem basicAuth)
#   NOTES_HOST   Perlite         basicAuth
#   HERMES_HOST  Dashboard       basicAuth + login do Hermes
#   API_HOST     API do Hermes   só HTTPS + Bearer API_SERVER_KEY
#                                (basicAuth quebraria os apps de celular)
services:
  perlite:
    image: sec77/perlite:latest
    container_name: perlite
    restart: unless-stopped
    environment:
      - NOTES_PATH=Pessoal
      - HOME_FILE=Bem-vindo
      - SITE_TITLE=Pessoal
      - SITE_NAME=Notas
      - LINE_BREAKS=true
      - NICE_LINKS=true
      - SHOW_TOC=true
      - SHOW_LOCAL_GRAPH=true
      - HTML_SAFE_MODE=true
      - HIDDEN_FILE_ACCESS=false
      - HIDE_FOLDERS=docs,private,trash
    volumes:
      - ./obsidian/vaults/Pessoal:/var/www/perlite/Pessoal:ro
    networks:
      - default

  perlite-web:
    image: nginx:stable
    container_name: perlite-web
    restart: unless-stopped
    volumes:
      - ./docker/perlite/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/perlite/graph-nav-fix.js:/var/www/perlite/.js/graph-nav-fix.js:ro
    volumes_from:
      - perlite
    depends_on:
      - perlite
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.perlite.rule=Host(`${NOTES_HOST}`)"
      - "traefik.http.routers.perlite.entrypoints=websecure"
      - "traefik.http.routers.perlite.tls.certresolver=leresolver"
      - "traefik.http.routers.perlite.middlewares=agent-auth"
      - "traefik.http.middlewares.agent-auth.basicauth.users=${TRAEFIK_BASIC_AUTH_USERS}"
      - "traefik.http.services.perlite.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"

  hermes:
    image: nousresearch/hermes-agent:v2026.9.7
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    shm_size: "1gb"
    volumes:
      - ./hermes/data:/opt/data
      - ./obsidian/vaults/Pessoal:/vaults/Pessoal
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_PUBLIC_URL=https://${HERMES_HOST}
      - OBSIDIAN_VAULT_PATH=/vaults/Pessoal
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_CORS_ORIGINS=*
    mem_limit: 4g
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      # Duas rotas no mesmo container: cada router aponta para o seu service,
      # senão o Traefik não sabe se é a 9119 ou a 8642.
      - "traefik.http.routers.hermes-dash.rule=Host(`${HERMES_HOST}`)"
      - "traefik.http.routers.hermes-dash.entrypoints=websecure"
      - "traefik.http.routers.hermes-dash.tls.certresolver=leresolver"
      - "traefik.http.routers.hermes-dash.middlewares=agent-auth"
      - "traefik.http.routers.hermes-dash.service=hermes-dash"
      - "traefik.http.services.hermes-dash.loadbalancer.server.port=9119"
      - "traefik.http.routers.hermes-api.rule=Host(`${API_HOST}`)"
      - "traefik.http.routers.hermes-api.entrypoints=websecure"
      - "traefik.http.routers.hermes-api.tls.certresolver=leresolver"
      - "traefik.http.routers.hermes-api.service=hermes-api"
      - "traefik.http.services.hermes-api.loadbalancer.server.port=8642"
      - "traefik.docker.network=traefik"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    volumes:
      - ./open-webui/data:/app/backend/data
    environment:
      - TZ=America/Sao_Paulo
      - OPENAI_API_BASE_URL=http://hermes:8642/v1
      - OPENAI_API_KEY=${API_SERVER_KEY}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_URL=https://${CHAT_HOST}
      - ENABLE_OLLAMA_API=false
    depends_on:
      - hermes
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.rule=Host(`${CHAT_HOST}`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.tls.certresolver=leresolver"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik"

networks:
  traefik:
    external: true
