# Stack do home server (Portainer + Traefik). Arquivo COMPLETO, não override:
#   docker compose -f docker-compose.homeserver.yml up -d
#
# Nada publica porta no host; o Traefik alcança os serviços pela rede "traefik".
# Hosts e credenciais vêm das variáveis configuradas na stack do Portainer.
#
#   NOTES_HOST   Perlite         basicAuth
#   HERMES_HOST  Dashboard       basicAuth + login do Hermes
services:
  perlite:
    image: sec77/perlite:latest
    container_name: perlite
    restart: unless-stopped
    environment:
      - NOTES_PATH=Pessoal
      - SITE_TITLE=Pessoal
      - SITE_NAME=Notas
      - LINE_BREAKS=true
      - NICE_LINKS=true
      - SHOW_TOC=true
      - SHOW_LOCAL_GRAPH=true
      - HTML_SAFE_MODE=true
      - HIDDEN_FILE_ACCESS=false
      - HIDE_FOLDERS=docs,private,trash
    volumes:
      - ./obsidian/vaults/Pessoal:/var/www/perlite/Pessoal:ro
    networks:
      - default

  perlite-graph:
    image: python:3.12-alpine
    container_name: perlite-graph
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "watch_metadata.py"]
    environment:
      - TZ=America/Sao_Paulo
      - VAULT_PATH=/vault
      - INTERVAL_SECONDS=10
    volumes:
      - ./obsidian/vaults/Pessoal:/vault
      - ./docker/perlite/build_metadata.py:/app/build_metadata.py:ro
      - ./docker/perlite/watch_metadata.py:/app/watch_metadata.py:ro
    networks:
      - default

  perlite-web:
    image: nginx:stable
    container_name: perlite-web
    restart: unless-stopped
    volumes:
      - ./docker/perlite/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/perlite/graph-nav-fix.js:/var/www/perlite/.js/graph-nav-fix.js:ro
    volumes_from:
      - perlite
    depends_on:
      - perlite
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.perlite.rule=Host(`${NOTES_HOST:?Defina_NOTES_HOST_no_Portainer}`)"
      - "traefik.http.routers.perlite.entrypoints=websecure"
      - "traefik.http.routers.perlite.tls.certresolver=leresolver"
      - "traefik.http.routers.perlite.middlewares=agent-auth"
      - "traefik.http.middlewares.agent-auth.basicauth.users=${TRAEFIK_BASIC_AUTH_USERS:?Defina_TRAEFIK_BASIC_AUTH_USERS_no_Portainer}"
      - "traefik.http.services.perlite.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"

  hermes:
    image: nousresearch/hermes-agent:v2026.9.7
    container_name: hermes
    restart: unless-stopped
    entrypoint: ["sh", "/opt/boot-holographic.sh"]
    shm_size: "1gb"
    volumes:
      - ./hermes/data:/opt/data
      - ./obsidian/vaults/Pessoal:/obsidian
      - ./docker/hermes/ensure-holographic.py:/opt/ensure-holographic.py:ro
      - ./docker/hermes/entrypoint.sh:/opt/boot-holographic.sh:ro
    environment:
      - TZ=America/Sao_Paulo
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_PUBLIC_URL=https://${HERMES_HOST:?Defina_HERMES_HOST_no_Portainer}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?Defina_HERMES_DASHBOARD_BASIC_AUTH_USERNAME_no_Portainer}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH:?Defina_HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH_no_Portainer}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?Defina_HERMES_DASHBOARD_BASIC_AUTH_SECRET_no_Portainer}
      - OBSIDIAN_VAULT_PATH=/obsidian
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/obsidian
      - API_SERVER_ENABLED=false
      - API_SERVER_HOST=127.0.0.1
    mem_limit: 4g
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hermes-dash.rule=Host(`${HERMES_HOST:?Defina_HERMES_HOST_no_Portainer}`)"
      - "traefik.http.routers.hermes-dash.entrypoints=websecure"
      - "traefik.http.routers.hermes-dash.tls.certresolver=leresolver"
      - "traefik.http.routers.hermes-dash.middlewares=agent-auth"
      - "traefik.http.routers.hermes-dash.service=hermes-dash"
      - "traefik.http.services.hermes-dash.loadbalancer.server.port=9119"
      - "traefik.docker.network=traefik"

networks:
  traefik:
    external: true
