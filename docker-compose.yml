# Stack local (PC ou qualquer servidor sem Traefik). Tudo por porta no host:
#   Chat (Open WebUI)   http://localhost:3000
#   Notas (Perlite)     http://localhost:8080
#   Dashboard Hermes    http://localhost:9119
#   API do Hermes       http://localhost:8642/v1   (Bearer API_SERVER_KEY)
#
# Home server com Traefik: use docker-compose.homeserver.yml (arquivo completo,
# sem portas no host).
services:
  # Visualizador das notas. Só lê os .md; quem escreve é o agente (ou você).
  # Perlite é PHP-FPM (FastCGI :9000); o nginx traduz HTTP -> FastCGI.
  perlite:
    image: sec77/perlite:latest
    container_name: perlite
    restart: unless-stopped
    environment:
      # Precisa ser SÓ o nome da pasta, igual ao último segmento do volume.
      - NOTES_PATH=Pessoal
      - HOME_FILE=Bem-vindo
      - SITE_TITLE=Pessoal
      - SITE_NAME=Notas
      - LINE_BREAKS=true
      - NICE_LINKS=true
      - SHOW_TOC=true
      - SHOW_LOCAL_GRAPH=true
      - HTML_SAFE_MODE=true
      - HIDDEN_FILE_ACCESS=false
      - HIDE_FOLDERS=docs,private,trash
    volumes:
      - ./obsidian/vaults/Pessoal:/var/www/perlite/Pessoal:ro

  perlite-web:
    image: nginx:stable
    container_name: perlite-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/perlite/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/perlite/graph-nav-fix.js:/var/www/perlite/.js/graph-nav-fix.js:ro
    volumes_from:
      - perlite
    depends_on:
      - perlite

  # Hermes Agent (Nous Research). Tudo que é estado mora em /opt/data.
  #   9119 = dashboard (login do .env)
  #   8642 = API OpenAI-compatível (Bearer API_SERVER_KEY)
  hermes:
    image: nousresearch/hermes-agent:v2026.9.7
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    shm_size: "1gb"
    ports:
      - "9119:9119"
      - "8642:8642"
    volumes:
      - ./hermes/data:/opt/data
      # O mesmo vault do Perlite: o agente lê e escreve essas notas.
      - ./obsidian/vaults/Pessoal:/vaults/Pessoal
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_PORT=9119
      - OBSIDIAN_VAULT_PATH=/vaults/Pessoal
      - API_SERVER_ENABLED=true
      # 0.0.0.0 para o Open WebUI (outro container) e o celular alcançarem.
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_CORS_ORIGINS=*
    mem_limit: 4g

  # Chat no browser. Guarda contas e histórico; o "cérebro" é o Hermes.
  # O primeiro usuário cadastrado vira admin.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - ./open-webui/data:/app/backend/data
    environment:
      - TZ=America/Sao_Paulo
      # Fala com o Hermes pela rede interna do Docker, nunca pela internet.
      - OPENAI_API_BASE_URL=http://hermes:8642/v1
      - OPENAI_API_KEY=${API_SERVER_KEY}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_OLLAMA_API=false
    depends_on:
      - hermes
