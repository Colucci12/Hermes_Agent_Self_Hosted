# Stack local (PC ou qualquer servidor sem Traefik). Tudo por porta no host:
#   Chat (Open WebUI)   http://localhost:3000
#   Notas (Perlite)     http://localhost:8080
#   Dashboard Hermes    http://localhost:9119
#   API do Hermes       http://localhost:8642/v1   (Bearer API_SERVER_KEY)
#
# Home server com Traefik: use docker-compose.homeserver.yml (arquivo completo,
# sem portas no host).
services:
  # Visualizador das notas. Só lê os .md; quem escreve é o agente (ou você).
  # Perlite é PHP-FPM (FastCGI :9000); o nginx traduz HTTP -> FastCGI.
  perlite:
    image: sec77/perlite:latest
    container_name: perlite
    restart: unless-stopped
    environment:
      # Precisa ser SÓ o nome da pasta, igual ao último segmento do volume.
      - NOTES_PATH=Pessoal
      - SITE_TITLE=Pessoal
      - SITE_NAME=Notas
      - LINE_BREAKS=true
      - NICE_LINKS=true
      - SHOW_TOC=true
      - SHOW_LOCAL_GRAPH=true
      - HTML_SAFE_MODE=true
      - HIDDEN_FILE_ACCESS=false
      - HIDE_FOLDERS=docs,private,trash
    volumes:
      - ./obsidian/vaults/Pessoal:/var/www/perlite/Pessoal:ro

  # Regenera metadata.json (grafo do Perlite) quando o vault muda.
  # Imagem pública + scripts do Git: Portainer só puxa o repo, sem build.
  perlite-graph:
    image: python:3.12-alpine
    container_name: perlite-graph
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "watch_metadata.py"]
    environment:
      - TZ=America/Sao_Paulo
      - VAULT_PATH=/vault
      - INTERVAL_SECONDS=10
    volumes:
      - ./obsidian/vaults/Pessoal:/vault
      - ./docker/perlite/build_metadata.py:/app/build_metadata.py:ro
      - ./docker/perlite/watch_metadata.py:/app/watch_metadata.py:ro

  perlite-web:
    image: nginx:stable
    container_name: perlite-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/perlite/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/perlite/graph-nav-fix.js:/var/www/perlite/.js/graph-nav-fix.js:ro
    volumes_from:
      - perlite
    depends_on:
      - perlite

  # Hermes Agent (Nous Research). Tudo que é estado mora em /opt/data.
  #   9119 = dashboard (login do .env)
  #   8642 = API OpenAI-compatível (Bearer API_SERVER_KEY)
  hermes:
    image: nousresearch/hermes-agent:v2026.9.7
    container_name: hermes
    restart: unless-stopped
    # Precisa ser o dispatcher oficial (s6): ele sobe dashboard + API.
    # Só `hermes gateway run` deixa a 9119 morta.
    entrypoint: ["sh", "/opt/boot-holographic.sh"]
    shm_size: "1gb"
    ports:
      - "9119:9119"
      - "8642:8642"
    volumes:
      - ./hermes/data:/opt/data
      # O mesmo vault do Perlite: o agente lê e escreve essas notas.
      - ./obsidian/vaults/Pessoal:/vaults/Pessoal
      - ./docker/hermes/ensure-holographic.py:/opt/ensure-holographic.py:ro
      - ./docker/hermes/entrypoint.sh:/opt/boot-holographic.sh:ro
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_PORT=9119
      # A skill do Obsidian le isto no .env interno (/opt/data/.env), nao so aqui.
      # O script de boot copia o valor para la.
      - OBSIDIAN_VAULT_PATH=/vaults/Pessoal
      - API_SERVER_ENABLED=true
      # 0.0.0.0 para o Open WebUI (outro container) e o celular alcançarem.
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_CORS_ORIGINS=*
    mem_limit: 4g

  # Chat no browser. Guarda contas e histórico; o "cérebro" é o Hermes.
  # O primeiro usuário cadastrado vira admin.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - ./open-webui/data:/app/backend/data
    environment:
      - TZ=America/Sao_Paulo
      # Fala com o Hermes pela rede interna do Docker, nunca pela internet.
      - OPENAI_API_BASE_URL=http://hermes:8642/v1
      - OPENAI_API_KEY=${API_SERVER_KEY}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_OLLAMA_API=false
      # Site = só boca. RAG/embedding ficam no Hermes, iguais em qualquer interface.
      - BYPASS_EMBEDDING_AND_RETRIEVAL=true
      # Sem isso o Open WebUI grava config no SQLite e ignora as envs abaixo.
      - ENABLE_PERSISTENT_CONFIG=false
      # Tasks do site viram sessão extra no Hermes (gasta cota, polui o dashboard).
      - ENABLE_TITLE_GENERATION=false
      - ENABLE_FOLLOW_UP_GENERATION=false
      - ENABLE_TAGS_GENERATION=false
      - ENABLE_AUTOCOMPLETE_GENERATION=false
      - ENABLE_RETRIEVAL_QUERY_GENERATION=false
      - ENABLE_SEARCH_QUERY_GENERATION=false
      # Agente pode demorar (tool + 503 do Gemini). Doc do Open WebUI: 1800s.
      - AIOHTTP_CLIENT_TIMEOUT=1800
    depends_on:
      - hermes
