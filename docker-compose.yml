# Stack local (PC ou qualquer servidor sem Traefik). Tudo por porta no host:
#   Notas (Perlite)     http://localhost:8080
#   Dashboard Hermes    http://localhost:9119
#
# Home server com Traefik: use docker-compose.homeserver.yml (arquivo completo,
# sem portas no host).
services:
  # Visualizador das notas. Só lê os .md; quem escreve é o agente (ou você).
  # Perlite é PHP-FPM (FastCGI :9000); o nginx traduz HTTP -> FastCGI.
  perlite:
    image: sec77/perlite:latest
    container_name: perlite
    restart: unless-stopped
    environment:
      # Precisa ser SÓ o nome da pasta, igual ao último segmento do volume.
      - NOTES_PATH=Pessoal
      - SITE_TITLE=Pessoal
      - SITE_NAME=Notas
      - LINE_BREAKS=true
      - NICE_LINKS=true
      - SHOW_TOC=true
      - SHOW_LOCAL_GRAPH=true
      - HTML_SAFE_MODE=true
      - HIDDEN_FILE_ACCESS=false
      - HIDE_FOLDERS=docs,private,trash
    volumes:
      - ./obsidian/vaults/Pessoal:/var/www/perlite/Pessoal:ro

  # Regenera metadata.json (grafo do Perlite) quando o vault muda.
  # Imagem pública + scripts do Git: Portainer só puxa o repo, sem build.
  perlite-graph:
    image: python:3.12-alpine
    container_name: perlite-graph
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "watch_metadata.py"]
    environment:
      - TZ=America/Sao_Paulo
      - VAULT_PATH=/vault
      - INTERVAL_SECONDS=10
    volumes:
      - ./obsidian/vaults/Pessoal:/vault
      - ./docker/perlite/build_metadata.py:/app/build_metadata.py:ro
      - ./docker/perlite/watch_metadata.py:/app/watch_metadata.py:ro

  perlite-web:
    image: nginx:stable
    container_name: perlite-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/perlite/nginx-conf:/etc/nginx/conf.d:ro
      - ./docker/perlite/graph-nav-fix.js:/var/www/perlite/.js/graph-nav-fix.js:ro
    volumes_from:
      - perlite
    depends_on:
      - perlite

  # Hermes Agent (Nous Research). Tudo que é estado mora em /opt/data.
  #   9119 = dashboard (login do .env)
  hermes:
    image: nousresearch/hermes-agent:v2026.9.7
    container_name: hermes
    restart: unless-stopped
    # Precisa ser o dispatcher oficial (s6): ele sobe dashboard + API.
    # Só `hermes gateway run` deixa a 9119 morta.
    entrypoint: ["sh", "/opt/boot-holographic.sh"]
    shm_size: "1gb"
    ports:
      - "9119:9119"
    volumes:
      - ./hermes/data:/opt/data
      # Vault separado do /opt/data (doc Docker + skill obsidian).
      - ./obsidian/vaults/Pessoal:/obsidian
      - ./docker/hermes/ensure-holographic.py:/opt/ensure-holographic.py:ro
      - ./docker/hermes/entrypoint.sh:/opt/boot-holographic.sh:ro
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_PORT=9119
      - OBSIDIAN_VAULT_PATH=/obsidian
      # Imagem Docker trava write_file em /opt/data. Vault é outro mount.
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/obsidian
      - API_SERVER_ENABLED=false
      # Mantém a API inacessível pela rede Docker, mesmo se a imagem a iniciar.
      - API_SERVER_HOST=127.0.0.1
    mem_limit: 4g
