server {
    listen 80;
    server_name localhost;

    root /var/www/perlite;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php;
    }

    # PHP-FPM do container perlite. Isto NÃO é o Traefik:
    # nginx só traduz HTTP -> FastCGI.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass perlite:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        sub_filter '</body>' '<script src="/.js/graph-nav-fix.js"></script></body>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~* ^/(.*)/.obsidian/appearance.json$ {
        allow all;
    }

    location ~* ^/(.*)/.obsidian/(.*)/(.*).css$ {
        allow all;
    }

    location ~* ^/(.*)/.obsidian/(.*)/(.*).map$ {
        allow all;
    }

    location ~ \.(git|github|obsidian|trash) {
        deny all;
    }

    location ~ \.(md|json)$ {
        deny all;
    }
}
